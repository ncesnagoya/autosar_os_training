name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    # The devcontainer image: athrill-gcc, cfg, atk2-sc1 and athrill2.
    container: ncesnagoya/autosar_os_training:0-debian-11
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build all programs and boot each on athrill
        run: bash .github/scripts/build-and-smoke.sh
