<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCES TRAINING BOARD</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17211e; background: #eef1ec; }
    body { margin: 0; padding: 24px; }
    main { max-width: 760px; margin: auto; }
    h1 { margin: 0 0 5px; font-size: 1.5rem; }
    .status { margin: 0 0 18px; color: #59636e; }
    .sim { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-weight: 650; }
    .lamp { width: 14px; height: 14px; flex: none; border: 2px solid #8d968c; border-radius: 50%; background: #d4d8d0; }
    .lamp.run { border-color: #1f7a3c; background: #2fbf5a; box-shadow: 0 0 6px 2px #2fbf5a88; }
    .lamp.pause { border-color: #9a7400; background: #f2c230; }
    .lamp.warn { border-color: #a3261b; background: #e2483a; }
    .board { position: relative; display: grid; grid-template-columns: 106px minmax(120px,1fr) minmax(135px,1.15fr) minmax(125px,.9fr); grid-template-rows: auto 1fr auto; gap: 16px; min-height: 410px; padding: 24px 24px 20px 42px; overflow: hidden; border: 10px solid #b8b9a7; border-radius: 9px; background: radial-gradient(ellipse at 50% 20%,#35694d,#174a38 72%); box-shadow: 0 12px 32px #16232b35, inset 0 0 0 2px #d5d0b8; color: #f5f1d9; }
    .board::before { content: "NCES TRAINING BOARD"; grid-column: 1 / -1; display: block; padding: 0 2px 8px; border-bottom: 1px solid #d9ddc288; color: #e4dfc5; font: 700 .75rem ui-monospace, monospace; letter-spacing: .12em; }
    .board::after { content: "JAPAN  •  TOPPERS"; position:absolute; bottom:8px; left:42px; color:#d7ddbd99; font:600 .62rem ui-monospace,monospace; letter-spacing:.14em; }
    .orientation { position:absolute; top:48px; right:28px; color:#e9e4ca; font:700 .68rem ui-monospace,monospace; text-align:center; line-height:1.15; }
    section { position: relative; min-height: 230px; padding: 15px 12px; border: 1px solid #e2dfc588; border-radius: 4px; background: #103d2c66; box-shadow: inset 0 0 0 1px #ffffff12; }
    .connectors { position:absolute; top:92px; bottom:38px; left:7px; width:22px; display:flex; align-items:center; justify-content:center; border:1px solid #d9ddc266; color:#e9e4ca; font:700 .58rem ui-monospace,monospace; writing-mode:vertical-rl; letter-spacing:.12em; }
    .cpu { grid-column:2; grid-row:2; align-self:center; justify-self:center; display:grid; place-items:center; width:min(100%,175px); aspect-ratio:1; border:7px solid #92988d; border-radius:7px; background:repeating-linear-gradient(90deg,#42494b 0 8px,#303638 8px 13px); box-shadow:0 5px 0 #182821, 0 8px 14px #071d1580; color:#d9dfd1; text-align:center; }
    .cpu span { display:block; width:100%; height:100%; border:1px solid #adb3a780; border-radius:2px; background:linear-gradient(140deg,#424b4b,#20282a); }
    .trace { position:absolute; z-index:0; height:1px; background:#abc59a40; transform-origin:left; pointer-events:none; }
    .psw { grid-column:1; grid-row:2; z-index:1; }
    .leds { grid-column:3; grid-row:2; z-index:1; }
    .dsw { grid-column:4; grid-row:2; z-index:1; }
    h2 { margin: 0 0 16px; text-align: center; color: #e9e4ca; font: 700 .78rem ui-monospace, monospace; letter-spacing: .12em; }
    .stack { display: grid; gap: 12px; }
    button { font: inherit; cursor: pointer; }
    .push { width: 78px; height: 78px; min-height: 0; justify-self: center; border: 3px solid #aeb6a7; border-radius: 50%; color: #23302b; font-weight: 750; background: radial-gradient(circle at 35% 28%,#fff,#c9cec4 62%,#929c91); box-shadow: 0 5px 0 #778277, 0 7px 8px #071d15aa; touch-action: none; }
    .push:active, .push.pressed { transform: translateY(4px); box-shadow: 0 1px 0 #778277, 0 3px 4px #071d15aa; }
    .ledrow, .switchrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
    .led { width: 24px; height: 24px; border: 2px solid #929888; border-radius: 50%; background: #533d38; box-shadow: inset 0 2px 5px #000b, 0 0 0 3px #133b2d; }
    .led.on { border-color: #ffb1a1; background: #ff392d; box-shadow: 0 0 8px 3px #ff5949, 0 0 22px 7px #ff392d88, inset 0 1px 4px #fff; }
    .toggle { position: relative; width: 48px; height: 64px; border: 2px solid #a9b0a0; border-radius: 5px; background: linear-gradient(90deg,#525b53,#b6bbae 48%,#687068); box-shadow: 0 3px 0 #0b3022; }
    .toggle::after { content: ""; position: absolute; width: 27px; height: 30px; top: 4px; left: 8px; border: 1px solid #586356; border-radius: 4px; background: linear-gradient(#f6f4e9,#9da598); box-shadow: 0 1px 3px #0008; transition: transform .12s; }
    .toggle[aria-checked="true"]::after { transform: translateY(21px); }
    .label { font-weight: 650; }
    .marks { grid-column:2 / -1; grid-row:3; display:flex; justify-content:flex-end; align-items:center; gap:14px; }
    .marks img { display:block; height:48px; width:auto; filter:drop-shadow(0 2px 3px #071d1599); }
    .marks img.plate { box-sizing:border-box; padding:8px 10px; border-radius:6px; background:#fbfaf3; }
    @media (max-width: 720px) { body { padding: 14px; } .board { grid-template-columns: 92px 1fr 1fr; grid-template-rows:auto auto auto; gap:10px; padding:18px 14px 30px 28px; } .connectors { top:82px; bottom:34px; left:5px; } .cpu { grid-column:2; grid-row:2; width:100px; } .psw { grid-column:2; grid-row:3; } .leds { grid-column:3; grid-row:2; } .dsw { grid-column:3; grid-row:3; } section { min-height: auto; padding:12px 9px; } .push { width:64px; height:64px; } .stack { gap:8px; } .board::after { left:28px; } .marks { grid-column:1 / -1; grid-row:4; } .marks img { height:38px; } }
    @media (max-width: 420px) { .board { grid-template-columns: 82px 1fr 1fr; padding-left:20px; } section { padding:10px 6px; } h2 { font-size:.65rem; letter-spacing:.06em; } .toggle { width:42px; height:56px; } .toggle::after { left:5px; } .toggle[aria-checked="true"]::after { transform:translateY(14px); } }
  </style>
</head>
<body>
<main>
  <h1>NCES TRAINING BOARD</h1>
  <p class="sim" role="status"><span id="lamp" class="lamp"></span><span id="sim">athrill3: 確認中…</span></p>
  <p id="status" class="status">接続中…</p>
  <div class="board" aria-label="HSBRH850F1L100 評価ボードのシミュレータ">
    <div class="connectors">40PIN I/O</div>
    <div class="orientation" aria-label="ボード上方向">N<br>↑</div>
    <div class="cpu" aria-label="CPUチップ"><span></span></div>
    <section class="psw"><h2>PUSH SW</h2><div class="stack">
      <button class="push" data-psw="1">PSW1</button><button class="push" data-psw="2">PSW2</button>
    </div></section>
    <section class="leds"><h2>LED</h2><div class="stack">
      <div class="ledrow"><span class="label">LED1</span><span class="led" data-led="0"></span></div>
      <div class="ledrow"><span class="label">LED2</span><span class="led" data-led="1"></span></div>
      <div class="ledrow"><span class="label">LED3</span><span class="led" data-led="2"></span></div>
      <div class="ledrow"><span class="label">LED4</span><span class="led" data-led="3"></span></div>
    </div></section>
    <section class="dsw"><h2>DIP SW <small>ON ↓</small></h2><div class="stack">
      <div class="switchrow"><span class="label">DSW1</span><button class="toggle" role="switch" aria-checked="false" data-dsw="1" aria-label="DSW1"></button></div>
      <div class="switchrow"><span class="label">DSW2</span><button class="toggle" role="switch" aria-checked="false" data-dsw="2" aria-label="DSW2"></button></div>
      <div class="switchrow"><span class="label">DSW3</span><button class="toggle" role="switch" aria-checked="false" data-dsw="3" aria-label="DSW3"></button></div>
      <div class="switchrow"><span class="label">DSW4</span><button class="toggle" role="switch" aria-checked="false" data-dsw="4" aria-label="DSW4"></button></div>
    </div></section>
    <div class="marks">
      <img class="plate" src="/img/nces.png" alt="NCES">
      <img src="/img/athrill.png" alt="athrill">
      <img src="/img/hakoniwa.png" alt="箱庭">
    </div>
  </div>
</main>
<script>
const status = document.querySelector('#status');
const lamp = document.querySelector('#lamp');
const sim = document.querySelector('#sim');
// Write only on change, so assistive tech does not re-announce every poll.
function setText(el, text) { if (el.textContent !== text) el.textContent = text; }
function setLamp(kind) { const name = kind ? `lamp ${kind}` : 'lamp'; if (lamp.className !== name) lamp.className = name; }
// Show whether athrill3 runs, and return false when the LEDs should read OFF.
function showSimulator(athrill) {
  if (!athrill || !athrill.supported) {
    setLamp('');
    setText(sim, 'athrill3: 状態を確認できません');
    return true;
  }
  const list = athrill.instances;
  if (list.length === 0) {
    setLamp('');
    setText(sim, 'athrill3: 未起動');
    return false;
  }
  if (list.length > 1) {
    setLamp('warn');
    setText(sim, `athrill3: ${list.length} 個が同じ dio.bin を使っています(${list.map(i => i.program).join(', ')})。1 つにしてください`);
    return true;
  }
  const [one] = list;
  if (one.executing === null) {
    setLamp('');
    setText(sim, `athrill3: 確認中 — ${one.program}`);
  } else if (one.executing) {
    setLamp('run');
    setText(sim, `athrill3: 実行中 — ${one.program}`);
  } else {
    setLamp('pause');
    setText(sim, `athrill3: 停止中(デバッガの入力待ちなど) — ${one.program}`);
  }
  return true;
}
async function getState() {
  try {
    const response = await fetch('/api/state', {cache: 'no-store'});
    const data = await response.json();
    const live = showSimulator(data.athrill);
    document.querySelectorAll('[data-led]').forEach(el => el.classList.toggle('on', live && !!data.led[Number(el.dataset.led)]));
    document.querySelectorAll('[data-dsw]').forEach(el => el.setAttribute('aria-checked', String(!!data.dsw[Number(el.dataset.dsw) - 1])));
    setText(status, !data.available ? 'dio.bin を読めません。LED はすべて OFF で表示しています。'
      : live ? 'dio.bin の I/O を表示中' : 'LED はすべて OFF で表示しています。');
  } catch (_) {
    setText(status, 'ボードに接続できません。');
    setLamp('');
    setText(sim, 'athrill3: 状態を確認できません');
  }
}
async function send(path, payload) {
  try { await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); }
  finally { getState(); }
}
document.querySelectorAll('[data-dsw]').forEach(button => button.addEventListener('click', () => {
  const on = button.getAttribute('aria-checked') !== 'true';
  button.setAttribute('aria-checked', String(on));
  send('/api/dsw', {number:Number(button.dataset.dsw), on});
}));
document.querySelectorAll('[data-psw]').forEach(button => {
  const number = Number(button.dataset.psw);
  const release = () => { button.classList.remove('pressed'); send('/api/psw', {number, on:false}); };
  button.addEventListener('pointerdown', event => { event.preventDefault(); button.classList.add('pressed'); send('/api/psw', {number, on:true}); });
  button.addEventListener('pointerup', release);
  button.addEventListener('pointerleave', event => { if (event.buttons) release(); });
  button.addEventListener('pointercancel', release);
  button.addEventListener('keydown', event => { if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) { event.preventDefault(); button.classList.add('pressed'); send('/api/psw', {number, on:true}); } });
  button.addEventListener('keyup', event => { if (event.key === ' ' || event.key === 'Enter') release(); });
});
getState(); setInterval(getState, 100);
</script>
</body>
</html>
